name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests (standard library only, no packages installed)
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # The gitleaks-action wrapper is deliberately not used: its licence is not MIT
  # and it needs a key for organisations. The release binary is free.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Report whether the pin is the latest stable release (informational)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name)"
          echo "pinned: v${GITLEAKS_VERSION}  latest stable: ${latest}"
          if [ "${latest}" != "v${GITLEAKS_VERSION}" ]; then
            echo "::notice::gitleaks pin v${GITLEAKS_VERSION} is not the latest stable release (${latest})"
          fi
      - run: gitleaks version
      - run: gitleaks git --redact --verbose .

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform version
      # Scoped to first-party directories (user decision, 30 Oct 2026): pool/ holds verbatim third-party
      # text that must not be reformatted (D3-04).
      - run: terraform fmt -check -recursive validation
      - name: Init and validate the smoke configuration
        working-directory: validation/smoke
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
